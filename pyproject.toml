[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-audio-auto"
version = "0.1.0"
description = "Versioned game audio generation, editing and review for agents"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "numpy>=2.2,<3",
  "soundfile>=0.13,<1", "filelock>=3.20,<4", "psutil>=7,<8"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[project.scripts]
audioctl = "game_audio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game_audio"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
